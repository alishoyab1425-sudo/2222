name: Build Spidexy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p app
          unzip -q spidexy_capacitor_admob_v5.zip -d app
          PACKAGE_FILE=$(find app -name package.json -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$PACKAGE_FILE" ]; then
            echo "package.json not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AdMob Test Mode
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "www/ads-config.js"
          if not p.exists():
              raise SystemExit("ads-config.js not found")
          s = p.read_text()
          s, count = re.subn(r'(TESTING\s*:\s*)false', r'\1true', s, count=1)
          if not count:
              raise SystemExit("TESTING:false not found")
          p.write_text(s)
          PY

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Add Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Setup Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: node setup-android.js

      - name: Capacitor Sync
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spidexy-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
